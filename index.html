<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulasi Tabel Email</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .controls {
      margin-bottom: 15px;
      padding: 10px;
      background-color: #f1f1f1;
      border-radius: 5px;
    }
    button, select {
      padding: 8px 12px;
      margin-right: 5px;
      cursor: pointer;
    }
    /* Pengaturan Container Tabel */
    .table-container {
      height: 350px; /* Tinggi dibatasi agar bisa di-scroll */
      overflow-y: auto;
      border: 1px solid #ccc;
      position: relative;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 12px; /* Tinggi baris ditentukan oleh padding ini */
      text-align: left;
    }
    th {
      background-color: #007bff;
      color: white;
      position: sticky;
      top: 0; /* Header tetap di atas saat di-scroll */
      z-index: 1;
    }
    /* Highlight untuk baris Last Cek */
    .row-last-cek {
      background-color: #ffeeba;
      font-weight: bold;
    }
    .pagination {
      margin-top: 15px;
    }
    .pagination button {
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <div class="controls">
    <select id="select-email">
      <option value="email_a@gmail.com">email_a@gmail.com</option>
      <option value="email_b@gmail.com">email_b@gmail.com</option>
    </select>
    
    <!-- Tombol Aksi -->
    <button onclick="loadDataOnline()" style="background-color: #007bff; color: white; border:none;">Load Data Online</button>
    <button onclick="aksiCekList()">Cek List (Aksi Lokal)</button>
    <button onclick="scrollToLastCek()">Cari Posisi Last Cek</button>
  </div>

  <!-- Container Tabel -->
  <div class="table-container" id="table-container">
    <table id="myTable">
      <thead>
        <tr>
          <th>No</th>
          <th>Data Email</th>
          <th>Status</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <!-- Default Kosong (0 Baris) saat pertama dibuka -->
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="pagination">
    <button onclick="changePage('prev')">Prev</button>
    <button onclick="changePage(1)">1</button>
    <button onclick="changePage(2)">2</button>
    <button onclick="changePage(3)">3</button>
    <button onclick="changePage('next')">Next</button>
  </div>

  <script>
    let currentPage = 1;
    let lastCekRowId = 25; // Simulasi: Anggap data ke-25 adalah yang terakhir dicek

    // Fungsi Render Tabel (Membuat Data Dummy)
    function renderTableData(isOnlineLoad = false) {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = ''; // Kosongkan tabel
      
      const email = document.getElementById('select-email').value;

      // Simulasi render 50 baris data per halaman
      for (let i = 1; i <= 50; i++) {
        const tr = document.createElement('tr');
        
        // Menentukan apakah baris ini adalah "Last Cek"
        if (i === lastCekRowId) {
          tr.classList.add('row-last-cek'); // Tambahkan class khusus
        }

        tr.innerHTML = `
          <td>${i}</td>
          <td>Data pesan dari ${email} (Halaman ${currentPage})</td>
          <td>${i === lastCekRowId ? 'Terakhir Dicek' : 'Belum'}</td>
          <td><input type="checkbox"></td>
        `;
        tbody.appendChild(tr);
      }

      // HANYA jika load online, lakukan auto scroll ke last cek
      if (isOnlineLoad) {
        setTimeout(() => {
          scrollToLastCek();
        }, 100); // Jeda sedikit agar browser selesai menggambar tabel
      }
    }

    // Aksi: Load Data Online (Memicu Auto Scroll)
    function loadDataOnline() {
      // Panggil render dengan parameter true (isOnlineLoad = true)
      renderTableData(true);
    }

    // Aksi: Cek List (TIDAK memicu Auto Scroll)
    function aksiCekList() {
      // Misalnya hanya memproses checkbox yang dicentang
      alert("Aksi Cek List dieksekusi. Tidak melakukan auto-scroll.");
      // Jika butuh render ulang, panggil renderTableData(false)
    }

    // Fungsi: Scroll ke Last Cek (Posisi baris ke-4 dari atas)
    function scrollToLastCek() {
      const container = document.getElementById('table-container');
      const targetRow = document.querySelector('.row-last-cek');

      if (container && targetRow) {
        const rowHeight = targetRow.offsetHeight;
        // Kita kurangi tinggi header tabel agar perhitungan tepat
        const headerHeight = document.querySelector('thead').offsetHeight; 
        
        // Kalkulasi: Posisi Baris - (3 baris di atasnya) - Tinggi Header
        const targetTop = targetRow.offsetTop;
        const scrollToPosition = targetTop - (3 * rowHeight) - headerHeight;

        container.scrollTo({
          top: Math.max(0, scrollToPosition), // Tidak boleh minus
          behavior: 'smooth'
        });
      } else {
        alert("Baris Last Cek tidak ditemukan di halaman ini.");
      }
    }

    // Fungsi: Pindah Halaman (Otomatis Scroll ke Atas)
    function changePage(page) {
      if (page === 'prev') {
        currentPage = currentPage > 1 ? currentPage - 1 : 1;
      } else if (page === 'next') {
        currentPage++;
      } else {
        currentPage = page;
      }

      // Render ulang data (tapi jangan auto-scroll ke last cek, karena bukan load awal)
      renderTableData(false);

      // LANGSUNG SCROLL TABEL KE PALING ATAS
      const container = document.getElementById('table-container');
      if (container) {
        container.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      }
    }
  </script>

</body>
</html>
